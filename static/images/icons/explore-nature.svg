<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="medallion-fill" cx="0.36" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFCF2"/>
      <stop offset="0.65" stop-color="#F7EDD4"/>
      <stop offset="1" stop-color="#E4D3AC"/>
    </radialGradient>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3EE"/>
      <stop offset="1" stop-color="#EAF6F8"/>
    </linearGradient>
    <linearGradient id="far-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9D48A"/>
      <stop offset="1" stop-color="#94B864"/>
    </linearGradient>
    <linearGradient id="near-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA850"/>
      <stop offset="1" stop-color="#55803A"/>
    </linearGradient>
    <linearGradient id="pine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FAE52"/>
      <stop offset="0.5" stop-color="#55883A"/>
      <stop offset="0.5" stop-color="#3E6B2E"/>
      <stop offset="1" stop-color="#2F5425"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A06A3C"/>
      <stop offset="1" stop-color="#6B4226"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8DC8A"/>
      <stop offset="0.5" stop-color="#E8B040"/>
      <stop offset="1" stop-color="#B57A22"/>
    </linearGradient>
    <linearGradient id="handle-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C89464"/>
      <stop offset="0.45" stop-color="#A06A3C"/>
      <stop offset="1" stop-color="#6B4226"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8DC8A"/>
      <stop offset="1" stop-color="#B57A22"/>
    </linearGradient>
    <radialGradient id="glass-glare" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens-clip">
      <circle cx="226" cy="218" r="104"/>
    </clipPath>
    <g id="pine-tree">
      <rect x="-7" y="52" width="14" height="30" fill="url(#bark)"/>
      <path d="M0 -70 L30 -18 L-30 -18 Z" fill="url(#pine)"/>
      <path d="M0 -40 L40 18 L-40 18 Z" fill="url(#pine)"/>
      <path d="M0 -8 L50 58 L-50 58 Z" fill="url(#pine)"/>
    </g>
  </defs>

  <circle cx="256" cy="264" r="230" fill="#26361F" opacity="0.45" filter="url(#soft-blur)"/>
  <circle cx="256" cy="250" r="232" fill="url(#medallion-fill)"/>
  <circle cx="256" cy="250" r="224" fill="none" stroke="#D9C598" stroke-width="2"/>

  <g transform="translate(256 250) scale(1.06) translate(-270 -262)">
  <ellipse cx="290" cy="392" rx="120" ry="11" fill="#4A3421" opacity="0.3" filter="url(#soft-blur)"/>

  <g transform="rotate(45 300 292)">
    <rect x="336" y="272" width="118" height="40" rx="20" fill="url(#handle-wood)"/>
    <rect x="352" y="279" width="86" height="7" rx="3.5" fill="#FFFFFF" opacity="0.3"/>
    <rect x="304" y="275" width="42" height="34" rx="5" fill="url(#ferrule)"/>
    <rect x="304" y="279" width="42" height="5" rx="2.5" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <g clip-path="url(#lens-clip)">
    <rect x="122" y="114" width="208" height="208" fill="url(#sky)"/>
    <ellipse cx="170" cy="168" rx="34" ry="11" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="196" cy="160" rx="24" ry="10" fill="#FFFFFF" opacity="0.85"/>
    <path d="M110 270 C160 225 230 235 270 255 C300 240 330 245 345 262 L345 330 L110 330 Z" fill="url(#far-hill)"/>
    <path d="M110 300 C170 262 270 268 345 296 L345 330 L110 330 Z" fill="url(#near-hill)"/>
    <use href="#pine-tree" transform="translate(262 222) scale(0.78)"/>
    <use href="#pine-tree" transform="translate(200 214)"/>
    <circle cx="226" cy="218" r="104" fill="url(#glass-glare)"/>
  </g>

  <circle cx="226" cy="218" r="104" fill="none" stroke="#7A5216" stroke-width="22" opacity="0.25" transform="translate(3 5)"/>
  <circle cx="226" cy="218" r="104" fill="none" stroke="url(#brass)" stroke-width="18"/>
  <circle cx="226" cy="218" r="112" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <circle cx="226" cy="218" r="95.5" fill="none" stroke="#8A5F1B" stroke-width="2" opacity="0.5"/>
  <path d="M150 196 A80 80 0 0 1 206 140" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
