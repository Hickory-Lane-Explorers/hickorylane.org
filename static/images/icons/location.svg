    <linearGradient id="pin-body" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#E88A62"/>
      <stop offset="0.45" stop-color="#D2603F"/>
      <stop offset="1" stop-color="#A33B26"/>
    </linearGradient>
    <radialGradient id="pin-window" cx="0.4" cy="0.35" r="0.8">
