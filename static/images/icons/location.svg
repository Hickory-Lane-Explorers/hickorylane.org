  <path d="M176 196 A80 80 0 0 1 238 118" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <circle cx="258" cy="199" r="70" fill="#7A2A18" opacity="0.35"/>
