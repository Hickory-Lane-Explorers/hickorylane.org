menu_label: Home
banner:
  title: Hickory Lane Explorers Inc.
  subtitle: Where Nature, Curiosity, and Jewish Values Grow Together
welcome:
  heading: Welcome to Hickory Lane Explorers
  text: |-
    **Discover the joy of learning through nature.**

    Hickory Lane Explorers, Inc. is a 501(c)(3) nonprofit organization dedicated to inspiring curiosity, confidence, and a lifelong appreciation for the natural world through hands-on outdoor education. Our programs combine science, environmental stewardship, creative exploration, and Jewish values to provide meaningful learning experiences for children and families in southeastern Wisconsin.

    Whether identifying native plants, observing wildlife, conducting nature investigations, or exploring seasonal changes, every adventure encourages children to ask questions, make discoveries, and develop a deeper connection with the world around them.

    **Join us as we explore, discover, and grow—one adventure at a time**
  photograph: /images/photographs/children-exploring-trail.jpg
  photograph_description: Two children explore a stone ledge next to a paved trail in a green forest.
highlights:
  - icon: /images/icons/explore-nature.svg
    text: Children learn by exploring natural spaces through hands-on experiences that foster curiosity and confidence.
  - icon: /images/icons/science.svg
    text: Our programs encourage observation, questioning, experimentation, and creative problem-solving through engaging science and nature activities.
  - icon: /images/icons/tree-of-life.svg
    text: We weave Jewish teachings into outdoor experiences, helping children develop gratitude, responsibility, kindness, and stewardship for G-d's creation.
after_school_program:
  icon: /images/icons/calendar.svg
  heading: After-School Program
  text: Our flagship after-school program encourages children to discover the outdoors through guided nature investigations, environmental science, creative projects, and seasonal exploration. Each week features a new theme designed to spark curiosity and build a deeper understanding of the natural world.
  details:
    - label: Ages
      text: Kindergarten and Up (6+)
    - label: When
      text: Thursdays • 4:30–5:30 PM (Doors open at 4:15 PM)
    - label: Location
      text: Provided Upon Registration
    - label: Cost
      text: $10 per child, per session*
    - label: What to bring
      text: a water bottle
    - label: What to wear
      text: 'Clothes that can handle outdoor exploration (and a little nature dirt!). In the winter use layers: insulated jacket, snow pants, waterproof boots, hat, and warm gloves/mittens.'
  footnote: '*Please inquire about early bird discount pricing'
seasonal_nature_series:
  icon: /images/icons/field-notes.svg
  heading: Seasonal Nature Series
  text: Throughout the year, Hickory Lane Explorers offers themed learning experiences. Each series highlights seasonal wildlife, habitats, and ecological changes through engaging outdoor adventures. Every unit combines science, creativity, outdoor exploration, and Jewish values to encourage children to see the beauty and purpose within creation.
