media:
  - name: photographs
    label: Photographs
    input: static/images/photographs
    output: /images/photographs
    categories: [image]
  - name: icons
    label: Icons
    input: static/images/icons
    output: /images/icons
    extensions: [svg, png, webp]

content:
  - name: home-page
    label: Home page
    type: file
    path: website-content/home-page.yaml
    format: yaml
    fields:
      - { name: menu_label, label: Name in the menu, type: string, required: true }
      - name: banner
        label: Banner at the top
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: subtitle, label: Subtitle, type: string }
      - name: welcome
        label: Welcome
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
          - { name: photograph, label: Photograph, type: image, required: true, options: { media: photographs } }
          - { name: photograph_description, label: Photograph description, description: One sentence for people who cannot see the photograph., type: string }
      - name: highlights
        label: Three highlights
        type: object
        list: true
        fields:
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - { name: text, label: Text, type: text }
      - name: after_school_program
        label: After-School Program
        type: object
        fields:
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
          - name: details
            label: Details
            type: object
            list: true
            fields:
              - { name: label, label: Label, description: "For example: Cost", type: string }
              - { name: text, label: Text, type: text }
          - { name: footnote, label: Small note below, type: string }
      - name: seasonal_nature_series
        label: Seasonal Nature Series
        type: object
        fields:
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
      - name: dates
        label: Dates
        type: object
        fields:
          - { name: heading, label: Heading, description: "The website adds the years, for example: Dates 2026 - 2027", type: string }
          - { name: start_year, label: Start year, description: "The year of the first month, for example: 2026", type: number }
          - name: months
            label: Months
            type: object
            list: true
            fields:
              - { name: month, label: Month, type: select, required: true, options: { values: [January, February, March, April, May, June, July, August, September, October, November, December] } }
              - { name: days, label: Days, description: "Two digits for each day, for example: 03, 10, 17, 24", type: string }
      - name: topics
        label: Topics
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - name: sessions
            label: Sessions
            type: object
            list: true
            fields:
              - { name: date, label: Date, description: "For example: Sept. 03", type: string }
              - { name: topic, label: Topic, type: string }
          - { name: footnote, label: Small note below, type: string }
      - name: registration
        label: Registration
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
          - { name: form_address, label: Web address of the registration form, type: string }
          - { name: form_preview, label: Picture of the form, type: image, required: true, options: { media: photographs } }
          - { name: form_title, label: Form title, type: string }
          - { name: form_description, label: Form description, type: string }

  - name: organization-page
    label: Our Organization page
    type: file
    path: website-content/organization-page.yaml
    format: yaml
    fields:
      - { name: menu_label, label: Name in the menu, type: string, required: true }
      - name: banner
        label: Banner at the top
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: subtitle, label: Subtitle, type: string }
      - name: at_a_glance
        label: At a Glance
        type: object
        fields:
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - { name: heading, label: Heading, type: string }
          - name: facts
            label: Facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, description: "For example: Founded", type: string }
              - { name: text, label: Text, type: string }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
      - name: what_we_do
        label: What We Do
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - name: activities
            label: Activities
            type: object
            list: true
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
          - { name: closing_text, label: Closing text, type: text }
      - name: approach_to_learning
        label: Our Approach To Learning
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }
      - name: jewish_learning
        label: Jewish Learning
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: icon, label: Icon, type: image, required: true, options: { media: icons } }
          - { name: subheading, label: Smaller heading, type: string }
          - { name: text, label: Text, type: rich-text, options: { format: markdown, media: false } }

  - name: board-page
    label: Our Board page
    type: file
    path: website-content/board-page.yaml
    format: yaml
    fields:
      - { name: menu_label, label: Name in the menu, type: string, required: true }
      - name: banner
        label: Banner at the top
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: subtitle, label: Subtitle, type: string }
      - { name: introduction, label: Introduction, type: rich-text, options: { format: markdown, media: false } }
      - name: president
        label: President
        type: object
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string }
          - { name: photograph, label: Photograph, type: image, required: true, options: { media: photographs } }
          - { name: biography, label: Biography, type: rich-text, options: { format: markdown, media: false } }
      - name: members
        label: Other board members
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string }
          - { name: photograph, label: Photograph, description: Leave empty to show the leaf picture., type: image, options: { media: photographs } }
          - { name: biography, label: Biography, type: rich-text, options: { format: markdown, media: false } }

  - name: every-page
    label: Every page (banner photograph and footer)
    type: file
    path: website-content/every-page.yaml
    format: yaml
    fields:
      - { name: site_name, label: Site name, type: string, required: true }
      - { name: site_description, label: Site description for search engines, type: text }
      - { name: banner_photograph, label: Banner photograph, type: image, required: true, options: { media: photographs } }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: organization_name, label: Organization name, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: service_area, label: Service area, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: email, label: Email, type: string }
          - { name: copyright, label: Copyright line, type: string }

  - name: appearance
    label: Colors and fonts
    type: file
    path: website-content/appearance.yaml
    format: yaml
    fields:
      - name: colors
        label: Colors
        description: "Write each color as # and six letters or digits, for example: #5a734d"
        type: object
        fields:
          - { name: background, label: Background of every page, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Write # and six letters or digits, for example: #5a734d" } }
          - { name: text, label: Text on the background, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Write # and six letters or digits, for example: #ffffff" } }
          - { name: highlight, label: Highlight, description: "The line under the current menu item, the board member roles, and the outline around a selected link", type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Write # and six letters or digits, for example: #f2c14e" } }
          - { name: form_card, label: Registration form box, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Write # and six letters or digits, for example: #6f8862" } }
          - { name: calendar_day, label: Class days in the calendar, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Write # and six letters or digits, for example: #fbf5e6" } }
          - { name: calendar_day_text, label: Numbers on class days in the calendar, type: string, required: true, pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Write # and six letters or digits, for example: #2f3a29" } }
      - name: fonts
        label: Fonts
        description: Each choice uses fonts that are already on the visitor's device, so the look changes a little between devices.
        type: object
        fields:
          - name: display
            label: Headings, menu, names, and footer
            type: select
            required: true
            options:
              values:
                - { name: system, label: "System: the standard font of each device" }
                - { name: neo-grotesque, label: "Neo-Grotesque: plain and neutral, like Helvetica or Arial" }
                - { name: humanist, label: "Humanist: warm and easy to read, like Gill Sans or Calibri" }
                - { name: geometric-humanist, label: "Geometric Humanist: round and clean, like Avenir or Montserrat" }
                - { name: classical-humanist, label: "Classical Humanist: elegant, like Optima" }
                - { name: rounded, label: "Rounded: soft and friendly, with round ends" }
                - { name: transitional, label: "Transitional: a classic book font, like Charter or Cambria" }
                - { name: old-style, label: "Old Style: a traditional book font, like Palatino" }
                - { name: slab-serif, label: "Slab Serif: strong, with block-shaped ends, like Rockwell" }
                - { name: antique, label: "Antique: old-fashioned and sturdy, like Bookman or Georgia" }
          - name: body
            label: Paragraph text
            type: select
            required: true
            options:
              values:
                - { name: system, label: "System: the standard font of each device" }
                - { name: neo-grotesque, label: "Neo-Grotesque: plain and neutral, like Helvetica or Arial" }
                - { name: humanist, label: "Humanist: warm and easy to read, like Gill Sans or Calibri" }
                - { name: geometric-humanist, label: "Geometric Humanist: round and clean, like Avenir or Montserrat" }
                - { name: classical-humanist, label: "Classical Humanist: elegant, like Optima" }
                - { name: rounded, label: "Rounded: soft and friendly, with round ends" }
                - { name: transitional, label: "Transitional: a classic book font, like Charter or Cambria" }
                - { name: old-style, label: "Old Style: a traditional book font, like Palatino" }
                - { name: slab-serif, label: "Slab Serif: strong, with block-shaped ends, like Rockwell" }
                - { name: antique, label: "Antique: old-fashioned and sturdy, like Bookman or Georgia" }
